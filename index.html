<script type="text/javascript">
  // Single Page Apps for GitHub Pages
  // MIT License - https://github.com/rafgraph/spa-github-pages
  (function (l) {
    if (l.search[1] === '/') {
      var decoded = l.search.slice(1).split('&').map(function (s) {
        return s.replace(/~and~/g, '&')
      }).join('?');
      window.history.replaceState(null, null,
        l.pathname.slice(0, -1) + (decoded.length > 0 ? '?' + decoded : '') +
        l.hash
      );
    }
    if (l.search.slice(1).indexOf('p=') !== -1) {
      var decoded = l.search.slice(1).split('&').map(function (s) {
        return s.replace(/~and~/g, '&')
      });
      var paramIndex = decoded.findIndex(function (s) { return s.startsWith('p='); });
      if (paramIndex > -1) {
        var cleanPath = decoded[paramIndex].substring(2);
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + cleanPath +
          (decoded.length > 1 ? '?' + decoded.filter(function (s, idx) { return idx !== paramIndex; }).join('&') : '') +
          l.hash
        );
      }
    }
  }(window.location))
</script>
